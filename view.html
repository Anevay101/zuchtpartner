<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://dmhvizuendjgndkyjvzm.supabase.co" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <title>Pferd ansehen – MDR Pferdedatenbank – Lokal</title>
  <link rel="stylesheet" href="css/style.css?v=5443" />
</head>
<body>
<header class="topbar">
  <h1 id="page-heading">🐴 Pferd ansehen</h1>
  <nav>
    <a class="btn secondary" href="index.html">← Zur Übersicht</a>
    <a class="btn secondary" href="zuchtplaner.html">🐴 Zuchtplaner</a>
    <a class="btn secondary" href="turnierplaner.html">🏆 Turnierplaner</a>
    <a class="btn secondary" href="aussortierhilfe.html">🧹 Aussortierhilfe</a>
  </nav>
</header>

<main class="container view-mode horse-view-v53">
  <div class="view-actions">
    <a class="btn secondary" id="edit-link" href="horse.html">✏️ Bearbeiten</a>
    <a class="btn secondary" id="mdr-link-btn" href="#" target="_blank" rel="noopener" hidden>🔗 MDR-Pferdeseite</a>
    <span id="mdr-link-missing" class="small muted" hidden>MDR-Link nicht verfügbar – ID fehlt</span>
    <button type="button" id="delete-btn" class="danger">🗑️ Löschen</button>
  </div>
  <div class="view-navigation-settings" aria-label="Blätterreihenfolge">
    <label for="view-sort-field">Blättern nach</label>
    <select id="view-sort-field">
      <option value="name">Name</option><option value="age">Alter</option><option value="updated_at">Zuletzt bearbeitet</option>
      <option value="gp">GP</option><option value="ext">Ext</option><option value="extpct">Ext%</option><option value="int">Int</option>
    </select>
    <select id="view-sort-dir" aria-label="Sortierrichtung"><option value="asc">aufsteigend</option><option value="desc">absteigend</option></select>
  </div>

  <section class="horse-hero-card" id="horse-swipe-area">
    <button type="button" id="prev-horse-btn" class="horse-nav-arrow secondary" title="Vorheriges Pferd">←</button>
    <div class="horse-hero-center">
      <img id="image-preview" class="image-preview horse-hero-image" hidden alt="Bild des Pferdes" />
      <div id="horse-image-placeholder" class="horse-image-placeholder">🐴</div>
      <div id="horse-summary-chips" class="horse-summary-chips"></div>
      <div id="tag-badges" class="horse-tag-row"></div>
      <p id="last-edited" class="muted small"></p>
    </div>
    <button type="button" id="next-horse-btn" class="horse-nav-arrow secondary" title="Nächstes Pferd">→</button>
  </section>

  <div id="horse-important-missing" class="horse-important-missing" hidden></div>

  <div class="tabs horse-view-tabs">
    <button type="button" class="tab-btn active" data-tab="stammdaten">Stammdaten</button>
    <button type="button" class="tab-btn" data-tab="genetik">Genetik</button>
    <button type="button" class="tab-btn" data-tab="turnier">Turnierwerte</button>
    <button type="button" class="tab-btn" data-tab="zuchtschau">Zuchtschau</button>
    <button type="button" class="tab-btn" data-tab="zucht">Zucht &amp; Nachzucht</button>
    <button type="button" class="tab-btn" data-tab="stammbaum">Stammbaum</button>
  </div>

  <div class="tab-panel" data-tab-panel="stammdaten">
    <fieldset><legend>Stammdaten</legend><div class="form-grid">
      <div><label for="name">Name</label><input id="name" readonly /></div>
      <div><label for="external_id">ID</label><input id="external_id" readonly /></div>
      <div><label for="game_version">Spielversion</label><select id="game_version" disabled><option value="DE">DE</option><option value="EN">EN</option></select></div>
      <div><label for="gender">Geschlecht</label><select id="gender" disabled><option value=""></option><option>Stute</option><option>Hengst</option><option>Wallach</option><option>Hengstfohlen</option><option>Stutfohlen</option></select></div>
      <div><label for="breed">Rasse</label><input id="breed" readonly /></div>
      <div><label for="purebred_pct">Reinrassigkeit (%)</label><input id="purebred_pct" type="number" readonly /></div>
      <div id="breed-composition-field"><label for="breed_composition">Rasseanteile</label><input id="breed_composition" readonly /></div>
      <div><label for="coat_color">Fellfarbe</label><input id="coat_color" readonly /></div>
      <div><label for="flaxen_carrier">Flaxen-Träger (fl)?</label><select id="flaxen_carrier" disabled><option value="">unbekannt</option><option value="true">Ja</option><option value="false">Nein</option></select></div>
      <div id="appaloosa-pattern-field" hidden><label for="appaloosa_pattern">🐆 Sichtbares Appaloosa-Muster</label><select id="appaloosa_pattern" disabled><option value=""></option><option>Leopard</option><option>Few Spot</option><option>Spotted Blanket</option><option>Snowcap</option><option>Varnish Roan</option><option>Snowflake</option><option>anderes / unklar</option></select><div id="appaloosa-pattern-hint" class="tiny muted appaloosa-pattern-hint"></div></div>
      <div><label for="birthdate">Geburtsdatum</label><input id="birthdate" type="date" readonly /><p id="horse-age" class="muted small"></p></div>
      <div><label for="disease_free">Erbkrankheiten</label><select id="disease_free" disabled><option value="">unbekannt</option><option value="true">frei von Erbkrankheiten</option><option value="false">Erbkrankheit vorhanden</option></select></div>
      <div><label for="breeding_show_summary">ZS-Wert / Prognose</label><input id="breeding_show_summary" readonly /><div id="breeding-show-summary-note" class="tiny muted"></div></div>
    </div></fieldset>
    <fieldset><legend>Verwaltung</legend><div class="form-grid"><div><label for="owner">Besitzer</label><input id="owner" readonly /></div></div></fieldset>
    <fieldset><legend>Papiere &amp; Zucht</legend><div class="form-grid">
      <div><label for="breeding_allowed">Zuchtzulassung</label><select id="breeding_allowed" disabled><option value="">unbekannt</option><option value="true">Ja</option><option value="false">Nein</option></select></div>
      <div id="stud-station-field" hidden><label for="in_breeding_station">In Zuchtstation?</label><select id="in_breeding_station" disabled><option value="">unbekannt</option><option value="true">Ja</option><option value="false">Nein</option></select></div>
      <div id="stud-fee-field" hidden><label for="stud_fee">Decktaxe</label><input id="stud_fee" type="number" readonly placeholder="kostenlos" /><div class="tiny muted">Leer = kostenlos</div></div>
      <div><label for="hlp_slp">HLP/SLP</label><input id="hlp_slp" readonly /></div>
      <div><label for="ico">ICO (%)</label><input id="ico" type="number" readonly /></div>
    </div></fieldset>
    <fieldset><legend>Sonstiges</legend><div class="form-grid"><div style="grid-column:1/-1"><label for="notes">Notizen</label><textarea id="notes" rows="3" readonly></textarea></div><div><label for="image_url">Bild-URL</label><input id="image_url" type="url" readonly /></div></div></fieldset>
  </div>

  <div class="tab-panel" data-tab-panel="genetik" hidden><div id="detail-genetik"></div></div>

  <div class="tab-panel" data-tab-panel="turnier" hidden>
    <details class="card horse-turnier-section"><summary><strong>Turnierdaten aus der Pferdeseite</strong></summary><div id="detail-turnier"></div></details>
    <details class="card horse-turnier-section"><summary><strong>🏆 Turnierprofil</strong></summary><div id="horse-tournament-profile"></div></details>
    <details class="card horse-turnier-section"><summary><strong>⭐ MDR-Cup-Status</strong></summary><div id="horse-cup-status"></div></details>
  </div>

  <div class="tab-panel" data-tab-panel="zuchtschau" hidden>
    <section class="card horse-zs-card">
      <div class="group-heading">Zuchtschau</div>
      <div id="horse-zs-details"></div>
    </section>
  </div>

  <div class="tab-panel" data-tab-panel="zucht" hidden><div id="breeding-progress-panel"></div></div>

  <div class="tab-panel" data-tab-panel="stammbaum" hidden><div id="detail-stammbaum"></div></div>
  <p id="form-error" class="error"></p>
  <input type="hidden" id="raw-text" />
</main>

<script src="js/supabase-loader.js?v=5443"></script>
<script src="js/supabase-config.js?v=5443"></script>
<script src="js/database-local.js?v=5443"></script>
<script src="js/local-app.js?v=5443"></script>
<script src="js/learning-file.js?v=5443"></script>
<script src="js/parser.js?v=5443"></script>
<script src="js/data-quality.js?v=5443"></script>
<script src="js/planer-common.js?v=5443"></script>
<script src="js/horseForm.js?v=5443"></script>
<script src="js/tournament-recommendation.js?v=5443"></script>
<script src="js/horse-tournament-profile.js?v=5443"></script>
<script src="js/breeding-progress.js?v=5443"></script>
<script src="js/horseView.js?v=5443"></script>
</body></html>
